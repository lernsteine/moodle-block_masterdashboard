name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports: ["3306:3306"]
        options: --health-cmd="mariadb-admin ping --silent" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', moodle-branch: 'MOODLE_503_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_503_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_503_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_503_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: pgsql}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle Plugin CI
        run: |
          sudo locale-gen en_AU.UTF-8
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: Moodle coding standards
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: PHPDoc
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Plugin validation
        run: moodle-plugin-ci validate
      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints
      - name: Mustache
        run: moodle-plugin-ci mustache
      - name: Grunt
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: PHPUnit
        run: moodle-plugin-ci phpunit
